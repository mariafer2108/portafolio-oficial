<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diseño Gráfico · Maria Fernanda</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    body { background-color: #000; color: #fff; }
    @keyframes fadeIn { from {opacity:0; transform: translateY(16px);} to {opacity:1; transform: translateY(0);} }
    .animate-fadeIn { opacity:0; animation: fadeIn 0.6s ease-out forwards; }
  </style>
</head>
<body>
  <div id="root">Cargando página...</div>
  <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="es2015,react">
    console.log("JS is running");
    const { useState, useEffect } = React;

    function GraphicPage() {
      const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });
      const [selectedImage, setSelectedImage] = useState(null);

      useEffect(() => {
        const handleMouseMove = (e) => {
          setMousePosition({ x: e.clientX, y: e.clientY });
        };
        window.addEventListener("mousemove", handleMouseMove);
        return () => window.removeEventListener("mousemove", handleMouseMove);
      }, []);

      useEffect(() => {
        if (selectedImage) {
          document.body.style.overflow = "hidden";
          const onKey = (e) => {
            if (e.key === "Escape") setSelectedImage(null);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("keydown", onKey);
            document.body.style.overflow = "";
          };
        }
      }, [selectedImage]);

      const projects = [
          {
          id: 1,
          title: "Revista de Surf",
          category: "Publicación",
          color: "from-blue-600 to-teal-700",
          description: "Revista de diseño gráfico sobre surf",
          imageBase: "img/surf",
          pdfUrl: "revista_surf.pdf"
        },
          {
          id: 2,
          title: "Identidad Visual",
          category: "Logotipo",
          color: "from-purple-600 to-pink-700",
          description: "Diseño de marca personal o corporativa",
          imageBase: "img/logo 2"
        },
           {
          id:3,
          title: "Guitarra",
          category: "Ilustración",
          color: "from-amber-600 to-orange-700",
          description: "Diseño e ilustración de instrumento musical",
          imageBase: "img/guitar"
        },
       {
          id: 4,
          title: "Club Adulto Mayor 'Esperanza Mía'",
          category: "Identidad de marca",
          color: "from-green-600 to-amber-700",
          description: "Logotipo y estética floral cálida",
          imageBase: "img/adultomayor"
        },
          {
          id: 5,
          title: "Ave y Libro · Símbolo Educativo",
          category: "Isotipo monocromático",
          color: "from-gray-800 to-gray-600",
          description: "Exploración conceptual en blanco y negro",
          imageBase: "img/biblioteca"
        },
         {
          id: 6,
          title: "Productos Orgánicos",
          category: "Ilustración de marca",
          color: "from-green-500 to-emerald-700",
          description: "Personajes y sello artesanal agrícola",
          imageBase: "img/organicos"
        },
        {
          id: 7,
          title: "KMUSIC",
          category: "Diseño Gráfico",
          color: "from-pink-600 to-purple-700",
          description: "Diseño gráfico para proyecto KMUSIC",
          imageBase: "img/kmusic"
        }
      ];

      const uiuxProjects = [
        {
          id: 1,
          title: "Luthier",
          category: "Diseño UI/UX",
          description: "Interfaz moderna para luthieres",
          imageBase: "img/luthier"
        },
        {
          id: 2,
          title: "Guitar Chord App",
          category: "Diseño UI/UX",
          description: "Aplicación interactiva para acordes de guitarra",
          imageBase: "img/guitarchord"
        }
      ];

      return (
        <div className="min-h-screen bg-black text-white">
          <div
            className="hidden md:block fixed w-8 h-8 rounded-full border-2 border-purple-500 pointer-events-none z-50 mix-blend-difference transition-transform duration-200"
            style={{
              left: mousePosition.x - 16 + "px",
              top: mousePosition.y - 16 + "px",
              transform: "scale(1)",
            }}
          />
          <nav className="fixed w-full z-40 bg-black bg-opacity-80 backdrop-filter backdrop-blur-lg border-b border-white border-opacity-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
              <a href="index.html" className="shrink-0" aria-label="Volver a Inicio">
                <img src="img/logo.png" alt="Logo" className="w-10 sm:w-12 h-10 sm:h-12 object-contain" />
              </a>
              <div className="text-xs sm:text-sm text-white/70 space-x-1 sm:space-x-2 md:space-x-4 flex items-center whitespace-nowrap overflow-x-auto">
                <a href="web.html" className="hover:text-cyan-400">Desarrollo Web</a>
                <span className="text-white/30">·</span>
                <a href="sobre.html" className="hover:text-purple-400">Sobre mí</a>
                <span className="text-white/30">·</span>
                <a href="contacto.html" className="hover:text-emerald-400">Contacto</a>
                <span className="text-white/30">·</span>
                <a href="curriculum maria.pdf" download className="hover:text-cyan-400 transition">CV</a>
              </div>
            </div>
          </nav>

          <header className="pt-24 sm:pt-28 pb-6 sm:pb-8 max-w-7xl mx-auto px-4 sm:px-6">
            <h1 className="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black animate-fadeIn">Diseño Gráfico</h1>
            <p className="mt-4 text-sm sm:text-base text-gray-300 max-w-2xl animate-fadeIn" style={{animationDelay: '0.1s'}}>
              Identidad, ilustración y marcas con estilo suave y tipografía cuidada.
            </p>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pb-16 sm:pb-24">
            <h3 className="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8">Proyectos</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
              {projects.map((project, index) => (
                <div
                  key={project.id}
                  className="group relative rounded-2xl overflow-hidden cursor-pointer bg-white bg-opacity-5"
                  style={{
                    paddingBottom: "100%",
                    animation: "fadeIn 0.6s ease-out forwards",
                    animationDelay: index * 0.1 + "s",
                  }}
                  onClick={() => {
                    if (project.pdfUrl) {
                      // En mobile, abre directamente; en desktop abre modal
                      const isMobile = window.innerWidth < 768;
                      if (isMobile) {
                        window.open(project.pdfUrl, '_blank');
                      } else {
                        setSelectedImage(project);
                      }
                    } else if (project.driveUrl) {
                      window.open(project.driveUrl, '_blank');
                    } else {
                      setSelectedImage(project);
                    }
                  }}
                >
                  <div className="absolute inset-0">
                    <img
                      src={project.imageBase + ".png"}
                      alt={project.title}
                      className="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                      data-i="0"
                      onError={(e) => {
                        const exts = [".png", ".jpg", ".jpeg", ".webp", ".JPG", ".PNG", ".JPEG", ".WEBP"];
                        const i = Number(e.currentTarget.dataset.i || 0);
                        if (i < exts.length) {
                          e.currentTarget.src = project.imageBase + exts[i];
                          e.currentTarget.dataset.i = i + 1;
                        } else {
                          e.currentTarget.style.display = "none";
                        }
                      }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-br from-black to-black opacity-40 group-hover:opacity-60 transition-opacity duration-300" />
                    <div className="relative z-10 h-full flex flex-col justify-between p-4 sm:p-6">
                      <div className="flex items-start">
                        <div>
                          <p className="text-xs uppercase tracking-widest text-white text-opacity-60">
                            {project.category}
                          </p>
                          <h4 className="text-lg sm:text-xl md:text-2xl font-semibold mt-2">
                            {project.title}
                          </h4>
                        </div>
                      </div>
                      <div className="mt-4 sm:mt-6">
                        <p className="text-xs sm:text-sm text-white text-opacity-85">
                          {project.description}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <h3 className="text-2xl sm:text-3xl font-bold mt-12 sm:mt-16 mb-6 sm:mb-8">Tarjetas de Presentación</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
              <div
                className="group relative rounded-2xl overflow-hidden cursor-pointer bg-neutral-900 border border-white/10"
                onClick={() => setSelectedImage({ title: "Tarjeta Frente", imageBase: "img/tarjeta de presentacion front" })}
              >
                <div className="p-4">
                  <h4 className="text-lg font-semibold mb-4 text-white">Tarjeta Frente</h4>
                  <img
                    src="img/tarjeta de presentacion front.png"
                    alt="Tarjeta Frente"
                    className="w-full rounded-lg shadow-lg transition-transform duration-500 group-hover:scale-105"
                  />
                </div>
              </div>
              <div
                className="group relative rounded-2xl overflow-hidden cursor-pointer bg-neutral-900 border border-white/10"
                onClick={() => setSelectedImage({ title: "Tarjeta Detrás", imageBase: "img/tarjeta de presentacion back" })}
              >
                <div className="p-4">
                  <h4 className="text-lg font-semibold mb-4 text-white">Tarjeta Detrás</h4>
                  <img
                    src="img/tarjeta de presentacion back.png"
                    alt="Tarjeta Detrás"
                    className="w-full rounded-lg shadow-lg transition-transform duration-500 group-hover:scale-105"
                  />
                </div>
              </div>
              <div
                className="group relative rounded-2xl overflow-hidden cursor-pointer bg-neutral-900 border border-white/10"
                onClick={() => setSelectedImage({ title: "Tarjeta Gas Frente", imageBase: "img/tarjeta de presentacion gas back" })}
              >
                <div className="p-4">
                  <h4 className="text-lg font-semibold mb-4 text-white">Tarjeta Gas Frente</h4>
                  <img
                    src="img/tarjeta de presentacion gas back.png"
                    alt="Tarjeta Gas Frente"
                    className="w-full rounded-lg shadow-lg transition-transform duration-500 group-hover:scale-105"
                  />
                </div>
              </div>
              <div
                className="group relative rounded-2xl overflow-hidden cursor-pointer bg-neutral-900 border border-white/10"
                onClick={() => setSelectedImage({ title: "Tarjeta Gas Detrás", imageBase: "img/tarjeta de presentacion gas front" })}
              >
                <div className="p-4">
                  <h4 className="text-lg font-semibold mb-4 text-white">Tarjeta Gas Detrás</h4>
                  <img
                    src="img/tarjeta de presentacion gas front.png"
                    alt="Tarjeta Gas Detrás"
                    className="w-full rounded-lg shadow-lg transition-transform duration-500 group-hover:scale-105"
                  />
                </div>
              </div>
            </div>

            <h3 className="text-2xl sm:text-3xl font-bold mt-12 sm:mt-16 mb-6 sm:mb-8">Diseño UI/UX</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
              {uiuxProjects.map((project, index) => (
                <div
                  key={project.id}
                  className="group relative rounded-2xl overflow-hidden cursor-pointer bg-neutral-900 border border-white/10"
                  style={{
                    paddingBottom: "100%",
                    animation: "fadeIn 0.6s ease-out forwards",
                    animationDelay: (projects.length + index) * 0.1 + "s",
                  }}
                  onClick={() => setSelectedImage(project)}
                >
                  <div className="absolute inset-0 p-4 flex items-center justify-center">
                    <img
                      src={project.imageBase + ".png"}
                      alt={project.title}
                      className="max-w-full max-h-full object-contain transition-transform duration-500 group-hover:scale-105 shadow-xl rounded-lg"
                      data-i="0"
                      onError={(e) => {
                        const exts = [".png", ".jpg", ".jpeg", ".webp", ".JPG", ".PNG", ".JPEG", ".WEBP"];
                        const i = Number(e.currentTarget.dataset.i || 0);
                        if (i < exts.length) {
                          e.currentTarget.src = project.imageBase + exts[i];
                          e.currentTarget.dataset.i = i + 1;
                        } else {
                          e.currentTarget.style.display = "none";
                        }
                      }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-60 group-hover:opacity-80 transition-opacity duration-300" />
                    <div className="absolute inset-0 flex flex-col justify-end p-4 sm:p-6 z-10">
                      <div>
                        <p className="text-xs uppercase tracking-widest text-white text-opacity-60 mb-1">
                          {project.category}
                        </p>
                        <h4 className="text-lg sm:text-xl md:text-2xl font-semibold mb-2 text-white">
                          {project.title}
                        </h4>
                        <p className="text-xs sm:text-sm text-white text-opacity-85 line-clamp-2">
                          {project.description}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            <h3 className="text-2xl sm:text-3xl font-bold mt-12 sm:mt-16 mb-6 sm:mb-8">Proceso de Creación de un Vtuber</h3>
            <div className="bg-white/5 rounded-2xl p-6 sm:p-8 border border-white/10">
              <div className="flex flex-col items-center">
                <video 
                  controls 
                  className="w-full max-w-2xl rounded-lg shadow-lg cursor-pointer" 
                  onClick={() => setSelectedImage({ title: "Proceso de Creación Vtuber", videoUrl: "img/proceso.mp4" })}
                >
                  <source src="img/proceso.mp4" type="video/mp4" />
                  Tu navegador no soporta el elemento de video.
                </video>
              </div>
            </div>

            <div className="mt-12 sm:mt-16">
              <a href="index.html" className="inline-flex items-center gap-2 px-4 sm:px-5 py-2 sm:py-3 rounded-full bg-white/10 hover:bg-white/20 transition text-sm sm:text-base">
                ← Volver a Inicio
              </a>
            </div>
          </main>

          {selectedImage && (
            <div
              className="fixed inset-0 z-50 bg-black bg-opacity-95 flex flex-col items-center justify-center px-4 py-6 sm:py-8"
              onClick={() => setSelectedImage(null)}
            >
              <button
                className="absolute top-4 right-4 text-white hover:text-gray-300 transition text-2xl sm:text-3xl z-10"
                onClick={() => setSelectedImage(null)}
              >
                ✕
              </button>
              {selectedImage.pdfUrl ? (
                // PDF viewer
                <iframe
                  src={selectedImage.pdfUrl + "#toolbar=0&navpanes=0&scrollbar=0&view=FitH"}
                  style={{
                    width: 'calc(100% - 32px)',
                    height: 'calc(100vh - 100px)',
                    maxWidth: '1000px',
                    borderRadius: '8px',
                    border: 'none',
                    marginTop: '40px'
                  }}
                  frameBorder="0"
                  onClick={(e) => e.stopPropagation()}
                ></iframe>
              ) : selectedImage.videoUrl ? (
                // Video viewer
                <div className="flex items-center justify-center w-full h-screen max-h-[90vh]" onClick={(e) => e.stopPropagation()}>
                  <video controls className="max-w-full max-h-full rounded-lg" onClick={(e) => e.stopPropagation()}>
                    <source src={selectedImage.videoUrl} type="video/mp4" />
                    Tu navegador no soporta el elemento de video.
                  </video>
                </div>
              ) : (
                <div className="flex items-center justify-center w-full h-screen max-h-[90vh]" onClick={(e) => e.stopPropagation()}>
                  <img
                    src={selectedImage.imageBase + ".png"}
                    alt={selectedImage.title}
                    className="max-w-full max-h-full object-contain rounded-lg"
                    data-i="0"
                    onError={(e) => {
                      const exts = [".png", ".jpg", ".jpeg", ".webp", ".JPG", ".PNG", ".JPEG", ".WEBP"];
                      const i = Number(e.currentTarget.dataset.i || 0);
                      if (i < exts.length) {
                        e.currentTarget.src = selectedImage.imageBase + exts[i];
                        e.currentTarget.dataset.i = i + 1;
                      }
                    }}
                    onClick={(e) => e.stopPropagation()}
                  />
                </div>
              )}
            </div>
          )}
        </div>
      );
    }
    ReactDOM.render(<GraphicPage />, document.getElementById('root'));
  </script>
</body>
</html>
